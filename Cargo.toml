[workspace]
members = [".", "gpu_rdma_runtime"]
# default-members = ["."]

[package]
name = "flinke2c-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"

clap = { version = "4.5.4", features = ["derive", "env"] }
jni = { version = "0.21", features = ["invocation"] }
libloading = "0.8"
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num_cpus = "1.16"
udf-abi = { path = "udf-abi" }
